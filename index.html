<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>CDL Driver Application</title>
    <meta name="claude:viewport-fit-sides" content="cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Saira:ital,wght@0,400;0,500;0,600;0,700;1,700;1,800;1,900&family=Caveat:wght@600&display=swap"
    />
    <style>
      /* Layout: white logo bar → Interlogix-blue band (headline or progress) → white sheet that overlaps the band; the sheet holds the road map (left on desktop) and the work area. */
      :root {
        --page: #ffffff;
        --surface: #ffffff;
        --surface-2: #f3f5f9;
        --ink: #0e1b33;
        --muted: #46536b;
        --line: #cbd3e1;
        --accent: #234a98;
        --accent-strong: #1a3a7c;
        --on-accent: #ffffff;
        --accent-soft: #e3eaf6;
        --action: #f5c84c;
        --action-hover: #edb82a;
        --on-action: #0e1b33;
        --brand: #234a98;
        --on-brand: #ffffff;
        --brand-muted: #dce5f7;
        --brand-line: #8fa8d8;
        --brand-off: #3d61aa;
        --yellow: #f5c84c;
        --danger: #b42318;
        --danger-soft: #fdecea;
        --display: "Saira", "Arial Narrow", sans-serif;
        --body: "Saira", system-ui, -apple-system, "Segoe UI", sans-serif;
        --script: "Caveat", "Bradley Hand", cursive;
      }
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        background: var(--page);
        color: var(--ink);
        font-family: var(--body);
        font-size: 18px;
        line-height: 1.5;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      :focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 3px;
      }
      .band :focus-visible {
        outline-color: var(--yellow);
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      h1,
      h2,
      h3 {
        text-wrap: balance;
      }
      .wrap {
        max-width: 1120px;
        margin: 0 auto;
        padding-left: max(20px, env(safe-area-inset-left, 0px));
        padding-right: max(20px, env(safe-area-inset-right, 0px));
      }
      .top .wrap {
        padding-left: max(16px, env(safe-area-inset-left, 0px));
        padding-right: max(16px, env(safe-area-inset-right, 0px));
      }

      /* Logo bar: always white so the logo reads in either theme */
      .top {
        background: #ffffff;
        color: #0e1b33;
      }
      .top .wrap {
        padding-block: 10px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        min-width: 0;
      }
      .logo {
        height: 34px;
        width: auto;
        max-width: 100%;
        display: block;
      }
      .brand .sub {
        font-size: 14px;
        font-weight: 700;
        font-style: italic;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #234a98;
        border-left: 2px solid #cbd3e1;
        padding-left: 14px;
        white-space: nowrap;
      }
      @media (max-width: 700px) {
        .brand .sub {
          display: none;
        }
      }
      @media (max-width: 420px) {
        .logo {
          height: 30px;
        }
      }
      .lang {
        flex-shrink: 0;
        display: flex;
        gap: 2px;
        padding: 3px;
        border: 2px solid #cbd3e1;
        border-radius: 999px;
      }
      .lang button {
        min-height: 40px;
        min-width: 46px;
        padding: 0 10px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: #0e1b33;
        font-weight: 700;
        font-size: 15px;
      }
      .lang button[aria-pressed="true"] {
        background: #234a98;
        color: #ffffff;
      }
      .lang button:focus-visible {
        outline-color: #234a98;
      }

      /* Blue band */
      .band {
        background: var(--brand);
        color: var(--on-brand);
      }
      .band .wrap {
        padding-block: 20px 46px;
      }
      @media (min-width: 900px) {
        .band .wrap {
          padding-block: 40px 66px;
        }
      }
      .flag {
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--yellow);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      .flag::before {
        content: "";
        flex-shrink: 0;
        width: 48px;
        height: 12px;
        background: conic-gradient(
            var(--yellow) 25%,
            transparent 0 50%,
            var(--yellow) 0 75%,
            transparent 0
          )
          0 0 / 12px 12px;
      }
      .band h1 {
        margin: 14px 0 0;
        font-family: var(--display);
        font-weight: 900;
        font-style: italic;
        text-transform: uppercase;
        line-height: 0.98;
        letter-spacing: -0.01em;
        font-size: clamp(42px, 6vw, 68px);
        max-width: 14em;
        outline: none;
      }
      .hl {
        color: var(--yellow);
      }
      .band .lede {
        margin: 14px 0 0;
        font-size: clamp(18px, 2vw, 20px);
        color: var(--brand-muted);
        max-width: 34em;
      }
      .qtop {
        display: flex;
        align-items: center;
        gap: 12px;
        max-width: 760px;
      }
      .iconbtn {
        width: 48px;
        height: 48px;
        flex-shrink: 0;
        border-radius: 50%;
        border: 2px solid var(--brand-line);
        background: transparent;
        color: var(--on-brand);
        display: grid;
        place-items: center;
      }
      .iconbtn:hover {
        border-color: var(--on-brand);
      }
      .qmeta {
        display: flex;
        flex-direction: column;
        min-width: 0;
        flex: 1;
      }
      .qmeta .kick {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--yellow);
      }
      .qmeta .sec {
        font-weight: 700;
        font-size: 19px;
        line-height: 1.25;
      }
      .qcount {
        font-size: 15px;
        color: var(--brand-muted);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .segs {
        display: grid;
        gap: 5px;
        margin-top: 16px;
        max-width: 760px;
      }
      .segs span {
        height: 7px;
        border-radius: 4px;
        background: var(--brand-off);
      }
      .segs span.on {
        background: var(--yellow);
      }
      .bandmark {
        display: flex;
        align-items: center;
        gap: 18px;
      }
      .bandmark .big {
        width: 72px;
        height: 72px;
        flex-shrink: 0;
        border-radius: 50%;
        background: var(--yellow);
        color: #0e1b33;
        display: grid;
        place-items: center;
      }
      .bandmark h1 {
        margin: 0;
      }

      /* White sheet */
      .sheet {
        position: relative;
        margin-top: -26px;
      }
      .sheet .wrap {
        background: var(--surface);
        border-radius: 22px 22px 0 0;
        padding-block: 24px 28px;
      }
      @media (min-width: 1152px) {
        .sheet .wrap {
          padding-left: 32px;
          padding-right: 32px;
        }
      }
      .grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        grid-template-areas: "main" "map" "extra";
        gap: 24px;
      }
      .main {
        grid-area: main;
        min-width: 0;
        max-width: 700px;
      }
      .map {
        grid-area: map;
        min-width: 0;
      }
      .extra {
        grid-area: extra;
        min-width: 0;
        max-width: 700px;
      }
      .extra:empty {
        display: none;
      }
      .grid.asking .map {
        display: none;
      }
      @media (min-width: 900px) {
        .grid {
          grid-template-columns: 290px minmax(0, 1fr);
          grid-template-areas: "map main" "map extra";
          grid-template-rows: auto 1fr;
          column-gap: 48px;
          row-gap: 0;
          align-items: start;
        }
        .grid.asking .map {
          display: block;
        }
        .map {
          position: sticky;
          top: calc(env(safe-area-inset-top, 0px) + 16px);
        }
      }

      /* Road map */
      .map h2 {
        margin: 0;
        font-family: var(--display);
        font-weight: 800;
        font-style: italic;
        font-size: 16px;
        text-transform: uppercase;
        letter-spacing: 0.02em;
        color: var(--accent);
      }
      .map-sum {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 6px;
      }
      .map-sum .line {
        font-size: 15px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .bar {
        height: 10px;
        border-radius: 5px;
        background: var(--surface-2);
        overflow: hidden;
        border: 1px solid var(--line);
      }
      .bar > span {
        display: block;
        height: 100%;
        background: var(--yellow);
        border-radius: 5px;
        transition: width 0.3s ease;
      }
      .stops {
        list-style: none;
        margin: 10px 0 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .stop {
        width: 100%;
        display: grid;
        grid-template-columns: 32px minmax(0, 1fr) auto;
        align-items: center;
        gap: 12px;
        min-height: 52px;
        padding: 6px 10px;
        border: 2px solid transparent;
        border-radius: 10px;
        background: var(--surface-2);
        text-align: left;
      }
      .stop:hover {
        border-color: var(--line);
      }
      .stop.current {
        background: var(--surface);
        border-color: var(--accent);
      }
      .stop:disabled {
        cursor: default;
      }
      .dot {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: 16px;
        border: 2px solid var(--line);
        color: var(--muted);
      }
      .stop.done .dot,
      .stop.current .dot {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--on-accent);
      }
      .stop .t {
        font-weight: 700;
        font-size: 17px;
        line-height: 1.25;
      }
      .stop .s {
        font-size: 14px;
        color: var(--muted);
        white-space: nowrap;
      }
      .stop.done .s {
        color: var(--accent);
        font-weight: 600;
      }
      .stop .go {
        font-size: 14px;
        font-weight: 600;
        color: var(--accent);
      }

      /* Buttons */
      .btn {
        min-height: 62px;
        width: 100%;
        border-radius: 10px;
        border: 0;
        background: var(--action);
        color: var(--on-action);
        font-weight: 800;
        font-style: italic;
        text-transform: uppercase;
        letter-spacing: 0.02em;
        font-size: 20px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 0 22px;
      }
      .btn:hover {
        background: var(--action-hover);
      }
      .btn.ghost {
        background: transparent;
        color: var(--ink);
        border: 2px solid var(--line);
      }
      .btn.ghost:hover {
        border-color: var(--ink);
        background: transparent;
      }
      .btn.small {
        min-height: 52px;
        font-size: 17px;
        width: auto;
      }
      .linkbtn {
        background: none;
        border: 0;
        padding: 10px 4px;
        color: var(--accent);
        font-weight: 600;
        font-size: 16px;
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .saved {
        display: flex;
        align-items: center;
        gap: 8px;
        justify-content: center;
        font-size: 15px;
        color: var(--muted);
        margin-top: 10px;
      }

      /* Home */
      .ready {
        margin-top: 22px;
        padding: 16px 18px;
        background: var(--surface-2);
        border-radius: 14px;
      }
      .ready h2 {
        margin: 0 0 10px;
        font-size: 16px;
        font-weight: 700;
      }
      .ready ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .ready li {
        display: flex;
        gap: 12px;
        align-items: flex-start;
      }
      .ready svg {
        flex-shrink: 0;
        margin-top: 3px;
        color: var(--accent);
      }

      /* Question */
      .q {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .q .answer {
        margin-bottom: 24px;
      }
      @media (max-width: 899px) {
        .q {
          min-height: calc(100svh - 236px);
        }
      }
      .q h1 {
        margin: 0;
        font-family: var(--display);
        font-weight: 700;
        font-size: clamp(28px, 4vw, 40px);
        line-height: 1.12;
        outline: none;
      }
      .q .help {
        margin: 0;
        font-size: 18px;
        color: var(--muted);
        max-width: 34em;
      }
      .tag {
        display: inline-block;
        align-self: flex-start;
        font-size: 14px;
        font-weight: 700;
        padding: 3px 10px;
        border-radius: 999px;
        background: var(--surface-2);
        color: var(--muted);
        border: 1px solid var(--line);
      }
      .answer {
        margin-top: 16px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .input {
        width: 100%;
        min-height: 60px;
        padding: 12px 16px;
        border: 2px solid var(--line);
        border-radius: 12px;
        background: var(--surface);
        color: var(--ink);
        font-size: 20px;
      }
      .input:disabled {
        opacity: 0.55;
      }
      textarea.input {
        min-height: 120px;
        resize: vertical;
        line-height: 1.4;
      }
      .input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 4px var(--accent-soft);
      }
      .yn {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }
      .choice {
        min-height: 82px;
        border-radius: 12px;
        border: 2px solid var(--line);
        background: var(--surface);
        font-size: 23px;
        font-weight: 800;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 0 18px;
      }
      .opts {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .opts .choice {
        justify-content: flex-start;
        min-height: 64px;
        font-size: 19px;
        font-weight: 700;
        text-align: left;
      }
      .choice:hover {
        border-color: var(--ink);
      }
      .choice[aria-pressed="true"] {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--on-accent);
      }
      .box {
        width: 26px;
        height: 26px;
        flex-shrink: 0;
        border-radius: 7px;
        border: 2px solid currentColor;
        display: grid;
        place-items: center;
      }
      .err {
        padding: 12px 16px;
        border-radius: 12px;
        background: var(--danger-soft);
        color: var(--danger);
        font-weight: 600;
        font-size: 17px;
      }
      .qactions {
        position: sticky;
        bottom: 0;
        margin-top: 4px;
        padding: 14px 0 calc(14px + env(safe-area-inset-bottom, 0px));
        background: var(--surface);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }
      .helpstrip {
        margin-top: auto;
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
        padding: 14px 16px;
        background: var(--surface-2);
        border-radius: 12px;
      }
      .helpstrip > svg {
        color: var(--accent);
        flex-shrink: 0;
      }
      .helpstrip .txt {
        display: flex;
        flex-direction: column;
        min-width: 0;
        flex: 1 1 180px;
      }
      .helpstrip .lbl {
        font-weight: 700;
        font-size: 16px;
      }
      .helpstrip .num {
        font-size: 16px;
        color: var(--muted);
        user-select: all;
        font-variant-numeric: tabular-nums;
      }

      /* File */
      .filebox {
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
        padding: 16px;
        border: 2px dashed var(--line);
        border-radius: 14px;
      }
      .filebox img {
        width: 140px;
        max-width: 100%;
        aspect-ratio: 1.586;
        object-fit: cover;
        border-radius: 10px;
        border: 1px solid var(--line);
      }
      .filebox label.btn {
        width: auto;
      }

      /* Jobs */
      .tally {
        padding: 14px 16px;
        border-radius: 12px;
        background: var(--surface-2);
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .tally .line {
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .jobs {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .job {
        padding: 14px 16px;
        border: 2px solid var(--line);
        border-radius: 12px;
        display: flex;
        gap: 12px;
        align-items: flex-start;
        justify-content: space-between;
      }
      .job .name {
        font-weight: 700;
        font-size: 18px;
      }
      .job .meta {
        font-size: 15px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .pill {
        display: inline-block;
        margin-top: 6px;
        font-size: 13px;
        font-weight: 700;
        padding: 2px 10px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent-strong);
      }
      .jobform {
        padding: 18px;
        border: 2px solid var(--accent);
        border-radius: 14px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .jobform .row {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        gap: 12px;
      }
      .lab {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-weight: 600;
        font-size: 16px;
        min-width: 0;
      }
      .lab .input {
        min-height: 54px;
        font-size: 18px;
      }
      .check {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 48px;
        font-size: 17px;
        font-weight: 600;
      }
      .check input {
        width: 26px;
        height: 26px;
        accent-color: var(--accent);
        flex-shrink: 0;
      }
      .note {
        font-size: 15px;
        color: var(--muted);
        margin: 0;
      }

      /* Consents */
      .forms {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .form {
        padding: 14px 16px;
        border: 2px solid var(--line);
        border-radius: 12px;
      }
      .form .t {
        font-weight: 700;
        font-size: 17px;
      }
      .form p {
        margin: 4px 0 0;
        font-size: 15px;
        color: var(--muted);
      }
      .form details {
        margin-top: 6px;
        font-size: 15px;
      }
      .form summary {
        color: var(--accent);
        font-weight: 600;
        min-height: 36px;
        display: flex;
        align-items: center;
        cursor: pointer;
      }
      .agree {
        padding: 14px 16px;
        border-radius: 12px;
        background: var(--accent-soft);
      }
      .sigpad {
        min-height: 96px;
        border-bottom: 3px solid var(--ink);
        display: flex;
        align-items: flex-end;
        padding: 0 6px 6px;
        font-family: var(--script);
        font-size: 46px;
        line-height: 1;
        overflow-wrap: anywhere;
      }
      .sigpad.empty {
        color: var(--muted);
        font-family: var(--body);
        font-size: 16px;
      }

      /* Milestones */
      .after {
        display: flex;
        flex-direction: column;
        gap: 14px;
        max-width: 520px;
      }
      .after .lede {
        margin: 0;
        font-size: 20px;
        color: var(--muted);
      }
      .after h2 {
        margin: 6px 0 0;
        font-size: 18px;
      }
      .nextsteps {
        margin: 0;
        padding: 0;
        list-style: none;
        counter-reset: s;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .nextsteps li {
        counter-increment: s;
        display: grid;
        grid-template-columns: 34px 1fr;
        gap: 12px;
        align-items: start;
      }
      .nextsteps li::before {
        content: counter(s);
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: var(--accent);
        color: var(--on-accent);
        font-weight: 700;
        display: grid;
        place-items: center;
      }

      /* Footer */
      .demo {
        margin-top: 24px;
        padding-top: 14px;
        border-top: 1px solid var(--line);
        display: flex;
        gap: 4px 16px;
        flex-wrap: wrap;
        align-items: center;
        font-size: 14px;
        color: var(--muted);
      }
      .demo .sp {
        flex: 1 1 200px;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: calc(24px + env(safe-area-inset-bottom, 0px));
        transform: translateX(-50%);
        background: #234a98;
        color: #ffffff;
        padding: 14px 20px;
        border-radius: 12px;
        font-weight: 600;
        font-size: 17px;
        max-width: calc(100% - 32px);
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
        z-index: 10;
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }

      body {
        margin: 0;
      }
      img {
        max-width: 100%;
      }
      [hidden] {
        display: none !important;
      }
    </style>

        } catch (e) {}
        function save() {
          try {
            localStorage.setItem(KEY, JSON.stringify({ lang: S.lang, a: S.a }));
          } catch (e) {}
        }

        const $ = s => document.querySelector(s);
        const esc = s =>
          String(s == null ? "" : s).replace(
            /[&<>"']/g,
            c =>
              ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;",
              })[c],
          );
        const tt = o =>
          o == null
            ? ""
            : typeof o === "string"
              ? o
              : o[S.lang] != null
                ? o[S.lang]
                : o.en;
        const u = (k, vars) => {
          let s = tt(UI[k]);
          if (vars)
            for (const v in vars) s = s.split("{" + v + "}").join(vars[v]);
          return s;
        };
        const locale = () => (S.lang === "es" ? "es-US" : "en-US");

        function visibleQs(i) {
          return SECTIONS[i].qs.filter(q => !q.showIf || q.showIf(S.a));
        }
        function answered(q) {
          const v = S.a[q.id];
          if (q.type === "multi" || q.type === "employers")
            return Array.isArray(v) && v.length > 0;
          if (q.type === "consents") return v === true;
          return v != null && String(v).trim() !== "";
        }
        function secStatus(i) {
          if (i === 4)
            return S.a._submitted
              ? "done"
              : visibleQs(4).some(answered)
                ? "progress"
                : "todo";
          const qs = visibleQs(i);
          if (qs.filter(q => !q.optional).every(answered)) return "done";
          return qs.some(answered) ? "progress" : "todo";
        }
        const doneCount = () =>
          SECTIONS.filter((_, i) => secStatus(i) === "done").length;
        const minsLeft = () =>
          SECTIONS.reduce(
            (m, s, i) => m + (secStatus(i) === "done" ? 0 : s.mins),
            0,
          );
        const firstOpen = () => {
          const i = SECTIONS.findIndex((_, i) => secStatus(i) !== "done");
          return i < 0 ? 4 : i;
        };
        const anyAnswered = () => Object.keys(S.a).some(k => k[0] !== "_");

        function monthsCovered(jobs) {
          const now = new Date();
          const nowIdx = now.getFullYear() * 12 + now.getMonth();
          const min = nowIdx - 119;
          const set = new Set();
          (jobs || []).forEach(j => {
            if (!j.from) return;
            const [y, m] = j.from.split("-").map(Number);
            const s = y * 12 + m - 1;
            let e = nowIdx;
            if (!j.current && j.to) {
              const [y2, m2] = j.to.split("-").map(Number);
              e = y2 * 12 + m2 - 1;
            }
            for (let k = Math.max(s, min); k <= Math.min(e, nowIdx); k++)
              set.add(k);
          });
          return set.size;
        }
        function fmtMonth(v) {
          if (!v) return "";
          const [y, m] = v.split("-").map(Number);
          return new Date(y, m - 1, 1).toLocaleDateString(locale(), {
            month: "short",
            year: "numeric",
          });
        }

        /* ---------- Rendering ---------- */
        function renderMap() {
          const cur = S.view === "q" ? S.sec : firstOpen();
          $("#map").setAttribute("aria-label", u("mapLabel"));
          $("#map").innerHTML = `
      <h2>${u("mapTitle", { n: doneCount() })}</h2>
      <ol class="stops">
        ${SECTIONS.map((s, i) => {
          const st = secStatus(i);
          const isCur = i === cur && !(st === "done" && S.view !== "q");
          const sub =
            st === "done"
              ? u("stDone")
              : st === "progress"
                ? u("stProg")
                : u("stTodo", { m: s.mins });
          const dot = st === "done" ? ICON.check(16) : String(i + 1);
          const locked = i === 4 && S.a._submitted;
          return `<li><button type="button" class="stop ${st === "done" ? "done" : ""} ${isCur ? "current" : ""}" data-act="open" data-i="${i}" ${locked ? "disabled" : ""} ${isCur ? 'aria-current="step"' : ""}>
            <span class="dot">${dot}</span>
            <span class="t">${esc(tt(s.title))}</span>
            <span class="s">${sub}</span>
          </button></li>`;
        }).join("")}
      </ol>`;
        }

        function demoBar() {
          return `<div class="demo"><span class="sp">${u("demo")}</span>
      <button type="button" class="linkbtn" data-act="fill">${u("fill")}</button>
      <button type="button" class="linkbtn" data-act="reset">${S.resetArm ? u("resetSure") : u("reset")}</button></div>`;
        }

        function hlLast(t) {
          const i = t.lastIndexOf(" ");
          return i < 0
            ? `<span class="hl">${t}</span>`
            : `${t.slice(0, i)} <span class="hl">${t.slice(i + 1)}</span>`;
        }

        function renderHome() {
          const back = anyAnswered();
          return {
            band: `<div class="flag">${u("eyebrow")}</div>
        <h1 tabindex="-1">${hlLast(back ? u("welcomeBack") : u("welcome"))}</h1>
        <p class="lede">${back ? u("ledeBack") : u("lede")}</p>`,
            main: `<button type="button" class="btn" data-act="start">${back ? u("keepGoing") : u("start")} ${ICON.arrow}</button>
`,
            extra: `${
              back
                ? ""
                : `<div class="ready"><h2>${u("ready")}</h2><ul>
          ${["r1", "r2", "r3"].map(k => `<li>${ICON.check(20)}<span>${u(k)}</span></li>`).join("")}
        </ul></div>`
            }
        ${demoBar()}`,
          };
        }

        function renderInput(q) {
          const v = S.a[q.id];
          const desc = q.help ? 'aria-describedby="qh"' : "";
          switch (q.type) {
            case "text":
            case "email":
            case "date":
              return `<input class="input" id="q-${q.id}" data-q="${q.id}" type="${q.type}" aria-labelledby="qt" ${desc} value="${esc(v)}" ${q.auto ? `autocomplete="${q.auto}"` : ""} ${q.type === "email" ? 'inputmode="email"' : ""}>`;
            case "tel":
              return `<input class="input" id="q-${q.id}" data-q="${q.id}" type="tel" inputmode="tel" autocomplete="tel" aria-labelledby="qt" ${desc} placeholder="(000) 000-0000" value="${esc(v)}">`;
            case "textarea":
              return `<textarea class="input" id="q-${q.id}" data-q="${q.id}" aria-labelledby="qt" ${desc} ${q.auto ? `autocomplete="${q.auto}"` : ""}>${esc(v)}</textarea>`;
            case "select":
              return `<select class="input" id="q-${q.id}" data-q="${q.id}" aria-labelledby="qt"><option value="">${u("chooseState")}</option>
          ${STATES.map(([c, n]) => `<option value="${c}" ${v === c ? "selected" : ""}>${n} (${c})</option>`).join("")}</select>`;
            case "yesno":
              return `<div class="yn" role="group" aria-labelledby="qt">
          <button type="button" class="choice" data-act="pick" data-v="yes" aria-pressed="${v === "yes"}">${ICON.check(28)} ${u("yes")}</button>
          <button type="button" class="choice" data-act="pick" data-v="no" aria-pressed="${v === "no"}">${ICON.x} ${u("no")}</button></div>`;
            case "choice":
              return `<div class="opts" role="group" aria-labelledby="qt">${q.options.map(o => `<button type="button" class="choice" data-act="pick" data-v="${o.v}" aria-pressed="${v === o.v}">${esc(tt(o))}</button>`).join("")}</div>`;
            case "multi": {
              const arr = Array.isArray(v) ? v : [];
              return `<p class="note">${u("tapAll")}</p><div class="opts" role="group" aria-labelledby="qt">${q.options
                .map(o => {
                  const on = arr.includes(o.v);
                  return `<button type="button" class="choice" data-act="toggle" data-v="${o.v}" aria-pressed="${on}"><span class="box">${on ? ICON.check(18) : ""}</span>${esc(tt(o))}</button>`;
                })
                .join("")}</div>`;
            }
            case "file":
              return `<div class="filebox">
          ${S.photoUrl ? `<img src="${S.photoUrl}" alt="${u("photoAdded")}">` : ""}
          <input type="file" id="q-${q.id}" class="sr-only" accept="image/*" capture="environment" data-file="${q.id}">
          <label for="q-${q.id}" class="btn ghost small">${ICON.camera} ${v ? u("changePhoto") : u("choosePhoto")}</label>
          ${v ? `<span class="note">${u("photoAdded")}: ${esc(v)}</span>` : ""}
        </div>`;
            case "employers":
              return renderJobs();
            case "consents":
              return `<ul class="forms">${FORMS.map(
                f => `<li class="form"><div class="t">${esc(tt(f.t))}</div><p>${esc(tt(f.d))}</p>
            <details><summary>${u("readFull")}</summary><p>${u("fullText")}</p></details></li>`,
              ).join("")}</ul>
          <label class="check agree"><input type="checkbox" id="q-consents" data-check="consents" ${v === true ? "checked" : ""}> <span>${u("agree")}</span></label>`;
            case "signature": {
              const today = new Date().toLocaleDateString(locale(), {
                year: "numeric",
                month: "long",
                day: "numeric",
              });
              return `<label class="lab" for="q-signature">${u("sigLabel")}
            <input class="input" id="q-signature" data-q="signature" autocomplete="name" value="${esc(v != null ? v : "")}" placeholder="${esc(S.a.name || "")}"></label>
          <div class="sigpad ${v ? "" : "empty"}" id="sigpad" aria-hidden="true">${v ? esc(v) : u("sigHere")}</div>
          <p class="note">${u("sigDate", { d: today })}</p>`;
            }
          }
          return "";
        }

        function renderJobs() {
          const jobs = S.a.jobs || [];
          const months = monthsCovered(jobs);
          const yrs = Math.min(10, Math.floor(months / 12));
          const pct = Math.min(100, Math.round((months / 120) * 100));
          const list = jobs
            .map(
              (j, i) => `<li class="job"><div>
        <div class="name">${esc(j.company)}</div>
        <div class="meta">${esc(j.city)}${j.city ? " · " : ""}${fmtMonth(j.from)} – ${j.current ? u("now") : fmtMonth(j.to)}</div>
        ${j.driving ? `<span class="pill">${u("drivingTag")}</span>` : ""}
      </div><button type="button" class="linkbtn" data-act="rmjob" data-i="${i}" aria-label="${u("remove")}: ${esc(j.company)}">${u("remove")}</button></li>`,
            )
            .join("");
          const d = S.jobDraft;
          const form = d
            ? `<div class="jobform">
        ${S.jobErr ? `<div class="err" role="alert">${S.jobErr}</div>` : ""}
        <label class="lab" for="job-company">${u("fCompany")}<input class="input" id="job-company" data-job="company" value="${esc(d.company)}" autocomplete="organization"></label>
        <label class="lab" for="job-city">${u("fCity")}<input class="input" id="job-city" data-job="city" value="${esc(d.city)}"></label>
        <div class="row">
          <label class="lab" for="job-from">${u("fFrom")}<input class="input" type="month" id="job-from" data-job="from" value="${esc(d.from)}"></label>
          <label class="lab" for="job-to">${u("fTo")}<input class="input" type="month" id="job-to" data-job="to" value="${esc(d.to)}" ${d.current ? "disabled" : ""}></label>
        </div>
        <label class="check"><input type="checkbox" id="job-current" data-job="current" ${d.current ? "checked" : ""}> ${u("fCurrent")}</label>
        <label class="check"><input type="checkbox" id="job-driving" data-job="driving" ${d.driving ? "checked" : ""}> ${u("fDriving")}</label>
        ${d.current ? "" : `<label class="lab" for="job-reason">${u("fReason")}<input class="input" id="job-reason" data-job="reason" value="${esc(d.reason)}"></label>`}
        <div class="row"><button type="button" class="btn small" data-act="savejob">${u("saveJob")}</button><button type="button" class="btn ghost small" data-act="canceljob">${u("cancel")}</button></div>
      </div>`
            : `<button type="button" class="btn ghost" data-act="addjob">+ ${jobs.length ? u("addAnother") : u("addJob")}</button>`;
          return `<div class="tally"><div class="line"><span>${u("years", { y: yrs })}</span></div>
        <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="120" aria-valuenow="${months}" aria-label="${u("years", { y: yrs })}"><span style="width:${pct}%"></span></div></div>
      ${jobs.length ? `<ul class="jobs">${list}</ul>` : ""}
      ${form}
      <p class="note">${u("gapNote")}</p>`;
        }

        function renderQuestion() {
          const qs = visibleQs(S.sec);
          if (S.qi >= qs.length) S.qi = qs.length - 1;
          const q = qs[S.qi];
          const isLast = S.sec === 4 && S.qi === qs.length - 1;
          const autoAdv = q.type === "yesno" || q.type === "choice";
          const showContinue = !autoAdv || answered(q);
          return {
            band: `<div class="qtop">
          <button type="button" class="iconbtn" data-act="back" aria-label="${u("back")}">${ICON.back}</button>
          <div class="qmeta"><span class="kick">${u("stopN", { n: S.sec + 1 })}</span><span class="sec">${esc(tt(SECTIONS[S.sec].title))}</span></div>
          <span class="qcount">${u("qCount", { i: S.qi + 1, n: qs.length })}</span>
        </div>
        <div class="segs" style="grid-template-columns: repeat(${qs.length}, minmax(0, 1fr))" aria-hidden="true">${qs.map((_, i) => `<span class="${i <= S.qi ? "on" : ""}"></span>`).join("")}</div>`,
            main: `<form class="q" id="qform" novalidate>
          ${q.optional ? `<span class="tag">${u("optional")}</span>` : ""}
          <h1 id="qt" tabindex="-1">${esc(tt(q.label))}</h1>
          ${q.help ? `<p class="help" id="qh">${esc(tt(q.help))}</p>` : q.type === "yesno" ? `<p class="help" id="qh">${u("tapOne")}</p>` : ""}
          <div class="answer">${renderInput(q)}</div>
          ${S.err ? `<div class="err" role="alert">${S.err}</div>` : ""}
          <div class="helpstrip">${ICON.phone}<div class="txt"><span class="lbl">${u("help")}</span><span class="num" id="phonenum">${PHONE}</span></div>
            <button type="button" class="linkbtn" data-act="copy">${u("copy")}</button></div>
          <div class="qactions">
            ${showContinue ? `<button type="submit" class="btn">${isLast ? u("submit") : u("next")} ${ICON.arrow}</button>` : ""}
            ${q.optional && !answered(q) ? `<button type="button" class="linkbtn" data-act="skip">${u("skip")}</button>` : ""}
          </div>
        </form>`,
          };
        }

        function renderStopDone() {
          const n = S.sec + 1;
          const nx = SECTIONS[S.sec + 1];
          return {
            band: `<div class="bandmark"><div class="big">${ICON.check(38)}</div><h1 tabindex="-1">${hlLast(u("stopDone", { n }))}</h1></div>`,
            main: `<div class="after">
        <p class="lede">${u("nextUp", { s: esc(tt(nx.title)), m: nx.mins })}</p>
        <button type="button" class="btn" data-act="nextstop">${u("keepGoing")} ${ICON.arrow}</button>
        <button type="button" class="btn ghost" data-act="break">${u("takeBreak")}</button>
      </div>`,
          };
        }

        function renderDone() {
          const first =
            String(S.a.name || "")
              .trim()
              .split(/\s+/)[0] || "";
          return {
            band: `<div class="bandmark"><div class="big">${ICON.check(38)}</div><h1 tabindex="-1">${hlLast(u("doneTitle"))}</h1></div>`,
            main: `<div class="after">
        <p class="lede">${u("doneBody", { name: esc(first) })}</p>
        <h2>${u("whatNext")}</h2>
        <ol class="nextsteps"><li>${u("n1")}</li><li>${u("n2")}</li><li>${u("n3")}</li></ol>
        <button type="button" class="btn ghost" data-act="home">${u("backHome")}</button>
      </div>`,
            extra: demoBar(),
          };
        }

        function render(nav) {
          document.documentElement.lang = S.lang;
          $("#subtitle").textContent = u("sub");
          document
            .querySelectorAll('[data-act="lang"]')
            .forEach(b =>
              b.setAttribute("aria-pressed", String(b.dataset.v === S.lang)),
            );
          $("#shell").classList.toggle("asking", S.view !== "home");
          renderMap();
          const view =
            S.view === "home"
              ? renderHome()
              : S.view === "q"
                ? renderQuestion()
                : S.view === "stopdone"
                  ? renderStopDone()
                  : renderDone();
          $("#band").innerHTML = view.band;
          $("#main").innerHTML = view.main;
          $("#extra").innerHTML = view.extra || "";
          if (nav) {
            window.scrollTo(0, 0);
            let target;
            if (S.view === "q") {
              const inp = $("#main").querySelector(
                "input.input[data-q], textarea[data-q]",
              );
              target =
                window.matchMedia("(min-width: 900px)").matches && inp
                  ? inp
                  : $("#qt");
            } else {
              target = $("#band h1");
            }
            if (target) target.focus({ preventScroll: true });
          }
        }

        /* ---------- Flow ---------- */
        function validate(q) {
          if (q.type === "employers" && !(S.a.jobs || []).length)
            return u("needJob");
          if (q.type === "consents" && S.a.consents !== true)
            return u("needConsent");
          if (!q.optional && !answered(q)) return u("required");
          if (
            q.type === "tel" &&
            String(S.a.phone || "")
              .replace(/\D/g, "")
              .replace(/^1(?=\d{10}$)/, "").length !== 10
          )
            return u("phoneErr");
          return null;
        }
        function next() {
          const qs = visibleQs(S.sec);
          const q = qs[S.qi];
          if (q.type === "employers" && S.jobDraft) {
            if (!saveJob()) {
              render();
              return;
            }
          }
          const err = validate(q);
          if (err) {
            S.err = err;
            render();
            const e = $(".err");
            if (e) e.scrollIntoView({ block: "center", behavior: "smooth" });
            return;
          }
          S.err = null;
          const qs2 = visibleQs(S.sec);
          if (S.qi < qs2.length - 1) {
            S.qi++;
            render(true);
          } else if (S.sec === 4) {
            S.a._submitted = true;
            save();
            S.view = "done";
            render(true);
          } else {
            S.view = "stopdone";
            render(true);
          }
        }
        function openSection(i) {
          S.sec = i;
          S.err = null;
          S.jobDraft = null;
          const qs = visibleQs(i);
          const k = qs.findIndex(q => !q.optional && !answered(q));
          S.qi = k < 0 ? 0 : k;
          S.view = "q";
          render(true);
        }
        function saveJob() {
          const d = S.jobDraft;
          if (!d.company.trim() || !d.from) {
            S.jobErr = u("jobErr");
            return false;
          }
          if (!d.current && !d.to) {
            S.jobErr = u("jobErrEnd");
            return false;
          }
          S.a.jobs = (S.a.jobs || []).concat([
            {
              company: d.company.trim(),
              city: d.city.trim(),
              from: d.from,
              to: d.current ? "" : d.to,
              current: d.current,
              driving: d.driving,
              reason: d.current ? "" : d.reason.trim(),
            },
          ]);
          S.a.jobs.sort((x, y) => (y.from || "").localeCompare(x.from || ""));
          S.jobDraft = null;
          S.jobErr = null;
          S.err = null;
          save();
          return true;
        }
        let toastT;
        function toast(msg) {
          const t = $("#toast");
          t.textContent = msg;
          t.hidden = false;
          clearTimeout(toastT);
          toastT = setTimeout(() => {
            t.hidden = true;
          }, 2600);
        }

        function fillExample() {
          const y = new Date().getFullYear();
          S.a = {
            name: "Miguel Ángel Torres",
            phone: "(915) 555-0142",
            email: "",
            dob: "1986-04-12",
            address: "1420 Example St, El Paso, TX 79928",
            moved: "yes",
            cdlA: "yes",
            cdlState: "TX",
            cdlNum: "12345678",
            cdlExp: y + 2 + "-04-12",
            endorse: ["N"],
            medCard: "yes",
            otherLic: "no",
            years: "3-5",
            jobs: [
              {
                company: "Example Freight LLC",
                city: "El Paso, TX",
                from: y - 3 + "-03",
                to: "",
                current: true,
                driving: true,
                reason: "",
              },
              {
                company: "Sample Logistics",
                city: "Las Cruces, NM",
                from: y - 5 + "-06",
                to: y - 3 + "-02",
                current: false,
                driving: true,
                reason: "More home time",
              },
              {
                company: "Demo Warehouse Co.",
                city: "El Paso, TX",
                from: y - 10 + "-01",
                to: y - 5 + "-05",

                driving: false,
                reason: "Got my CDL",
              },
            ],
            accidents: "no",
            tickets: "yes",
            ticketsInfo: "Mar " + (y - 1) + " · Speeding, 10 mph over · Texas",
            suspended: "no",
            drug: "no",
            consents: true,
          };
          S.photoUrl = null;
          S.view = "home";
          S.resetArm = false;
          save();
          render(true);
          toast(u("filled"));
        }

        /* ---------- Events ---------- */
        document.addEventListener("click", e => {
          const b = e.target.closest("[data-act]");
          if (!b) return;
          const act = b.dataset.act;
          if (act !== "reset") S.resetArm = false;
          const qs = S.view === "q" ? visibleQs(S.sec) : null;
          const q = qs ? qs[S.qi] : null;
          switch (act) {
            case "lang":
              S.lang = b.dataset.v;
              save();
              render();
              break;
            case "start":
              openSection(firstOpen());
              break;
            case "open":
              openSection(Number(b.dataset.i));
              break;
            case "home":
              S.view = "home";
              render(true);
              break;
            case "back":
              S.err = null;
              S.jobDraft = null;
              if (S.qi > 0) {
                S.qi--;
                render(true);
              } else {
                S.view = "home";
                render(true);
              }
              break;
            case "pick":
              S.a[q.id] = b.dataset.v;
              S.err = null;
              save();
              render();
              setTimeout(() => {
                if (S.view === "q" && visibleQs(S.sec)[S.qi] === q) next();
              }, 240);
              break;
            case "toggle": {
              let arr = Array.isArray(S.a[q.id]) ? S.a[q.id].slice() : [];
              const v = b.dataset.v;
              if (v === "none") arr = arr.includes("none") ? [] : ["none"];
              else {
                arr = arr.filter(x => x !== "none");
                arr = arr.includes(v)
                  ? arr.filter(x => x !== v)
                  : arr.concat(v);
              }
              S.a[q.id] = arr;
              S.err = null;
              save();
              render();
              const btn = document.querySelector(
                `[data-act="toggle"][data-v="${v}"]`,
              );
              if (btn) btn.focus({ preventScroll: true });
              break;
            }
            case "skip":
              S.err = null;
              if (S.qi < qs.length - 1) {
                S.qi++;
                render(true);
              } else next();
              break;
            case "addjob":
              S.jobDraft = {
                company: "",
                city: "",
                from: "",
                to: "",
                current: !(S.a.jobs || []).length,
                driving: true,
                reason: "",
              };
              S.jobErr = null;
              render();
              {
                const f = $("#job-company");
                if (f) f.focus();
              }
              break;
            case "canceljob":
              S.jobDraft = null;
              S.jobErr = null;
              render();
              break;
            case "savejob":
              saveJob();
              render();
              break;
            case "rmjob":
              S.a.jobs.splice(Number(b.dataset.i), 1);
              save();
              render();
              break;
            case "nextstop":
              openSection(S.sec + 1);
              break;
            case "break":
              S.view = "home";
              render(true);
              toast(u("breakToast"));
              break;
            case "copy": {
              const done = () => toast(u("copied"));
              const fallback = () => {
                const r = document.createRange();
                r.selectNodeContents($("#phonenum"));
                const sel = getSelection();
                sel.removeAllRanges();
                sel.addRange(r);
              };
              try {
                navigator.clipboard.writeText(PHONE).then(done, fallback);
              } catch (err) {
                fallback();
              }
              break;
            }
            case "fill":
              fillExample();
              break;
            case "reset":
              if (!S.resetArm) {
                S.resetArm = true;
                b.textContent = u("resetSure");
              } else {
                S.a = {};
                S.photoUrl = null;
                S.resetArm = false;
                S.view = "home";
                save();
                render(true);
                toast(u("cleared"));
              }
              break;
          }
        });

        document.addEventListener("submit", e => {
          e.preventDefault();
          if (S.view === "q") next();
        });

        document.addEventListener("input", e => {
          const t = e.target;
          if (t.dataset.q) {
            S.a[t.dataset.q] = t.value;
            save();
            if (S.err) {
              S.err = null;
              const er = $("#qform .err");
              if (er) er.remove();
            }
            if (t.dataset.q === "signature") {
              const pad = $("#sigpad");
              pad.textContent = t.value || u("sigHere");
              pad.classList.toggle("empty", !t.value);
            }
          } else if (t.dataset.job && S.jobDraft && t.type !== "checkbox") {
            S.jobDraft[t.dataset.job] = t.value;
          }
        });

        document.addEventListener("change", e => {
          const t = e.target;
          if (t.dataset.q && t.tagName === "SELECT") {
            S.a[t.dataset.q] = t.value;
            save();
          } else if (t.dataset.check) {
            S.a[t.dataset.check] = t.checked;
            S.err = null;
            save();
            render();
            const c = $("#q-consents");
            if (c) c.focus({ preventScroll: true });
          } else if (t.dataset.job && t.type === "checkbox" && S.jobDraft) {
            S.jobDraft[t.dataset.job] = t.checked;
            render();
            const c = document.getElementById(t.id);
            if (c) c.focus({ preventScroll: true });
          } else if (t.dataset.file && t.files && t.files[0]) {
            const f = t.files[0];
            S.a[t.dataset.file] = f.name;
            save();
            const r = new FileReader();
            r.onload = () => {
              S.photoUrl = r.result;
              render();
            };
            r.readAsDataURL(f);
          }
        });

        render();
      })();
    </script>
  </body>
</html>
